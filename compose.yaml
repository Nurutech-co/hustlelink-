services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hustlelink
      POSTGRES_USER: ${POSTGRES_USER:-hustlelink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting PostgreSQL}
    ports:
      - "5432:5432"
    volumes:
      - hustlelink-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hustlelink-postgres:
